name: BachCuteCalendar
options:
  bundleIdPrefix: com.bachcute
  deploymentTarget:
    iOS: '17.0'
targets:
  BachCuteCalendar:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        SWIFT_VERSION: '5.9'
        PRODUCT_BUNDLE_IDENTIFIER: com.bachcute.calendar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bách Cute Calendar
    dependencies:
      - target: BachCuteWidget
        embed: true
  BachCuteWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        SWIFT_VERSION: '5.9'
        PRODUCT_BUNDLE_IDENTIFIER: com.bachcute.calendar.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
