name: Build Bach Cute Calendar IPA
on:
  push:
    branches: [bach-cute-calendar]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd CuteCalendar
          xcodegen generate
      - name: Build iOS app
        run: |
          xcodebuild -project CuteCalendar/BachCuteCalendar.xcodeproj -scheme BachCuteCalendar -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/DerivedData" build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/BachCuteCalendar.app" Payload/
          zip -qr BachCuteCalendar-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BachCuteCalendar-IPA
          path: BachCuteCalendar-unsigned.ipa
